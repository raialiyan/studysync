name: studysync-local
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: studysync_docker
      POSTGRES_USER: studysync
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.docker}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studysync -d studysync_docker"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - studysync_docker_data:/var/lib/postgresql/data
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://studysync:${POSTGRES_PASSWORD}@db:5432/studysync_docker
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env.docker}
      ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
      PORT: '8000'
      RUN_MIGRATIONS: 'false'
    ports:
      - '127.0.0.1:8000:8000'
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://127.0.0.1:8000
        VITE_WS_URL: ws://127.0.0.1:8000
    restart: unless-stopped
    depends_on: [backend]
    ports:
      - '127.0.0.1:5173:80'
volumes:
  studysync_docker_data:
